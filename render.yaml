services:
  - type: web
    name: docent-ai
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_TTL_HOURS
        value: 24
